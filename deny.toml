# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
#
# `bans` and `sources` are not overridden here: the dependency tree already
# passes those checks under cargo-deny's defaults.

[advisories]
ignore = [
    # No safe upgrade exists for either; both are pulled in transitively by
    # leptos itself, not by a direct choice of ours.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained, no safe upgrade — transitive via leptos_macro/leptos_router_macro/reactive_stores_macro" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, no safe upgrade — transitive via leptos (either_of)" },
]

[licenses]
# Every license actually present in the dependency tree today, all
# OSI-approved/FSF-free permissive licenses appropriate for a personal blog.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Zlib",
]
