# This workflow checks, builds and browser-tests the site on pushes to main,
# pull requests and manual runs. It never publishes: publishing is done by
# deploy.yml from a version tag, which calls this workflow so that both use
# one build definition (see docs/done/2026-10-28_separate-build-from-deploy.md).
# On a push to main, after the browser test passed, it also keeps the release
# "snapshot" up to date with a zip of the tested site (job snapshot), which
# deploy.yml publishes when it was built from the tagged commit.
# The browser test (end2end/) runs on the freshly built site served locally
# (job browser-test).
# It runs in Playwright's official container image, which already contains
# Chromium and its system libraries, so nothing is installed from Ubuntu's
# package server at test time. The image tag is read from
# end2end/package-lock.json (job build, output playwright_version) because
# Dependabot does not update images referenced in workflows: a bump of
# @playwright/test then needs no workflow edit.
# Documentation-only changes skip build and tests. The workflow is
# still always triggered (no paths filters) because the "build" check is
# required: a job skipped by a job-level "if" is reported as skipped, which
# counts as success, while a workflow skipped by paths filters never reports.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      playwright_version:
        description: Playwright version read from end2end/package-lock.json
        value: ${{ jobs.build.outputs.playwright_version }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect whether anything other than documentation changed
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # Documentation-only files: an ignore-list, not an allow-list. A code
          # folder forgotten in an allow-list would silently never be
          # published; a doc file missing from this list only costs one
          # unnecessary run.
          is_doc() {
            case "$1" in
              docs/* | README.md | CLAUDE.md | LICENSE) return 0 ;;
              *) return 1 ;;
            esac
          }

          # When in doubt, run everything.
          decide() {
            echo "Decision: code=$1 ($2)"
            echo "code=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            decide true "manual run"
          fi

          # When deploy.yml calls this workflow, the event is the caller's
          # push and the ref is the tag.
          case "$REF" in
            refs/tags/*) decide true "version tag: the deploy always builds" ;;
          esac

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The checkout is the merge commit; its first parent is the base.
            changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ]; then
            # A new branch or a force push leaves no usable "before" commit.
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              decide true "no usable previous commit"
            fi
            changed=$(git diff --no-renames --name-only "$BEFORE" "$AFTER")
          else
            decide true "unexpected event"
          fi

          echo "Changed files:"
          echo "$changed"

          if [ -z "$changed" ]; then
            decide true "empty list of changed files"
          fi

          while IFS= read -r file; do
            if ! is_doc "$file"; then
              decide true "not documentation: $file"
            fi
          done <<< "$changed"

          decide false "documentation only"

  build:
    # Skipped only when detection explicitly said "documentation only". If
    # detection fails its output is empty and build runs anyway, so a broken
    # detector can never let an untested pull request pass the required check.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      playwright_version: ${{ steps.playwright.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Playwright version from the lock file
        id: playwright
        run: |
          set -euo pipefail
          version=$(scripts/playwright-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build the site
        run: scripts/build-site.sh

      # The browser-test job needs the site, and runs on every event; deploy.yml
      # also publishes it when it calls this workflow.
      - name: Keep the built site for the browser test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: target/site
          retention-days: 1
          if-no-files-found: error

  browser-test:
    # Runs whenever build succeeded, even if change detection failed, so the
    # required browser-test check can never pass without a test; skipped
    # together with build on documentation-only changes. --ipc=host is
    # recommended by Playwright for Chromium.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright_version }}-noble
      options: --ipc=host
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: target/site

      - name: Install the browser test dependencies
        working-directory: end2end
        run: npm ci

      - name: Browser test on the freshly built site
        working-directory: end2end
        run: npx playwright test

  # Keeps the site of the last commit of main whose build and browser test
  # passed, as an asset of the pre-release "snapshot", for deploy.yml. Never
  # runs on pull requests, manual runs, when deploy.yml calls this workflow
  # (the ref is then a tag), or after a documentation-only skip (the browser
  # test did not run, so its result is not "success").
  snapshot:
    needs: [build, browser-test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.browser-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Download the tested site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: target/site

      # The commit is in the file name, not in the release: an asset is
      # replaced atomically, so the zip and the commit it was built from can
      # never disagree. The release's tag does not move with main.
      - name: Zip the content of the site
        run: |
          set -euo pipefail
          (cd target/site && zip -qr "../../site-$SHA.zip" .)

      - name: Create the release snapshot if it does not exist
        run: |
          set -euo pipefail
          if ! gh release view snapshot > /dev/null 2> view.err; then
            if [ "$(cat view.err)" != "release not found" ]; then
              cat view.err >&2
              exit 1
            fi
            gh release create snapshot --prerelease --latest=false --target "$SHA" \
              --title "Snapshot of main" \
              --notes "The site of the last commit of main whose build and browser test passed. The commit is in the file name. The tag snapshot itself does not follow main. Used by deploy.yml, see README."
          fi

      # Upload first, delete after: there is never a moment with no snapshot.
      - name: Upload the new zip
        run: gh release upload snapshot "site-$SHA.zip" --clobber

      - name: Delete the older zips
        run: |
          set -euo pipefail
          gh release view snapshot --json assets --jq '.assets[].name' \
            | while IFS= read -r name; do
                case "$name" in
                  "site-$SHA.zip") ;;
                  site-*.zip) gh release delete-asset snapshot "$name" -y ;;
                esac
              done
