# Publishes the site to GitHub Pages. Started by pushing a tag vX.Y.Z on a
# commit of main, after CHANGELOG.md has the section of that version.
# Checks, each failing the run visibly before anything is published:
#   - the tag has the form vX.Y.Z (numbers without leading zeros);
#   - the tagged commit is on main;
#   - CHANGELOG.md, at the tagged commit, has a "## [X.Y.Z]" heading.
# It then publishes the site by one of two paths:
#   - snapshot: build.yml keeps, for the last commit of main whose build and
#     browser test passed, a zip of the tested site in the release "snapshot".
#     When it was built from the tagged commit, that very site is published,
#     with no second build;
#   - rebuild: otherwise (a tag pushed while the build of its commit is still
#     running, a tag on a documentation-only commit, a missing snapshot) the
#     site is built and tested from the tagged commit by calling build.yml.
# A snapshot exists only for a commit whose build and browser test passed.
# Right after publishing it creates the GitHub Release of the version, with
# the notes from CHANGELOG.md and the zip of the published site attached.
# Finally the browser test runs on the live site.
# Why: docs/wip/separate-build-from-deploy.md.
name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One publication at a time, never cancelled half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      playwright_version: ${{ steps.playwright.outputs.version }}
    steps:
      - name: Check out the tagged commit with the history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag name
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z. Nothing was published."
            exit 1
          fi

      - name: Check the tagged commit is on main
        id: commit
        run: |
          set -euo pipefail
          commit=$(git rev-parse 'HEAD^{commit}')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if ! git rev-parse --verify --quiet origin/main > /dev/null; then
            git fetch --no-tags origin main
            main_ref=FETCH_HEAD
          else
            main_ref=origin/main
          fi
          if ! git merge-base --is-ancestor "$commit" "$main_ref"; then
            echo "::error::The tagged commit $commit is not on main. Nothing was published."
            exit 1
          fi

      - name: Check CHANGELOG.md has the section of this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing at the tagged commit. Nothing was published."
            exit 1
          fi
          if ! grep -Eq "^## \[${version//./\\.}\]( - .*)?$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' heading at the tagged commit. Nothing was published."
            exit 1
          fi

      - name: Read the Playwright version from the lock file
        id: playwright
        run: |
          set -euo pipefail
          version=$(scripts/playwright-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Fast path: takes the snapshot of the tagged commit, if there is one, and
  # passes it on as the artifact "site" of this run. Downloading it here, once,
  # avoids a race where a newer build replaces the asset between this check
  # and the publication. "Not found" is told apart from every other failure
  # (network, authorisation, corrupt zip), which fails the job: only a
  # missing snapshot may fall back to the rebuild.
  snapshot:
    needs: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      found: ${{ steps.take.outputs.found }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMIT: ${{ needs.check-tag.outputs.commit }}
    steps:
      - name: Take the snapshot of the tagged commit, if there is one
        id: take
        run: |
          set -euo pipefail
          if ! assets=$(gh release view snapshot --json assets --jq '.assets[].name' 2> view.err); then
            if [ "$(cat view.err)" != "release not found" ]; then
              cat view.err >&2
              exit 1
            fi
            assets=""
          fi
          if ! grep -Fxq "site-$COMMIT.zip" <<< "$assets"; then
            echo "::notice::No snapshot for commit $COMMIT: the site will be rebuilt."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p download target/site
          gh release download snapshot --pattern "site-$COMMIT.zip" --dir download
          unzip -q "download/site-$COMMIT.zip" -d target/site
          echo "::notice::Snapshot of commit $COMMIT found: it is published, the site is not rebuilt."
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Keep the snapshot site for the publication
        if: ${{ steps.take.outputs.found == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: target/site
          retention-days: 1
          if-no-files-found: error

  # Slow path: rebuild and test the site from the tagged commit.
  # build.yml has a job (snapshot) that requests contents: write. GitHub
  # checks the permissions of every job of a called workflow against the
  # grant of the calling job, even for a job that ends up skipped, so this
  # caller must grant contents: write (and nothing more). The called
  # workflow's jobs still declare their own permissions, and its snapshot
  # job never runs from here: it only runs on a push to refs/heads/main,
  # while this run's ref is a tag.
  build:
    needs: snapshot
    if: ${{ needs.snapshot.outputs.found == 'false' }}
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write

  deploy:
    needs: [check-tag, snapshot, build]
    if: ${{ !cancelled() && needs.check-tag.result == 'success' && (needs.snapshot.outputs.found == 'true' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: target/site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Creates the GitHub Release of the version right after publishing, in
  # parallel with verify-live and whether or not it passes: the Release
  # documents what went live, and a failed live test says what to fix in a
  # later patch version (decision recorded in
  # docs/wip/separate-build-from-deploy.md). The zip of the exact site that
  # was published lets an earlier version be published again without
  # rebuilding it. Safe to re-run: an existing Release gets its notes and its
  # zip replaced.
  release:
    needs: [check-tag, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the published site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: target/site

      - name: Zip the content of the site
        run: |
          set -euo pipefail
          (cd target/site && zip -qr "../../site-$TAG.zip" .)

      # Lines after the heading "## [X.Y.Z]" (optionally followed by " - date")
      # up to the next "## [" heading, without leading and trailing blank
      # lines. The version is compared as a fixed string, never as a pattern.
      - name: Extract the notes of this version from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${TAG#v}" awk '
            BEGIN { heading = "## [" ENVIRON["VERSION"] "]" }
            !on {
              if ($0 == heading || index($0, heading " - ") == 1) on = 1
              next
            }
            index($0, "## [") == 1 { exit }
            $0 ~ /^[[:space:]]*$/ { if (started) blanks++; next }
            { for (; blanks > 0; blanks--) print ""; started = 1; print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Version ${TAG#v} has no notes in CHANGELOG.md." > notes.md
          fi
          cat notes.md

      - name: Create the GitHub Release, or update it if it already exists
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2> view.err; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "site-$TAG.zip" --clobber
          else
            if [ "$(cat view.err)" != "release not found" ]; then
              cat view.err >&2
              exit 1
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file notes.md --latest "site-$TAG.zip"
          fi

  verify-live:
    needs: [check-tag, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.check-tag.outputs.playwright_version }}-noble
      options: --ipc=host
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the browser test dependencies
        working-directory: end2end
        run: npm ci

      - name: Browser test on the published site
        working-directory: end2end
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test
