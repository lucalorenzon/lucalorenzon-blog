# Publishes the site to GitHub Pages. Started by pushing a tag vX.Y.Z on a
# commit of main, after CHANGELOG.md has the section of that version.
# Checks, each failing the run visibly before anything is published:
#   - the tag has the form vX.Y.Z (numbers without leading zeros);
#   - the tagged commit is on main;
#   - CHANGELOG.md, at the tagged commit, has a "## [X.Y.Z]" heading.
# It then calls build.yml on the tagged commit, so the published site is built
# and tested by the same definition used on every push, publishes the built
# site, and finally runs the browser test on the live site.
# Why: docs/wip/separate-build-from-deploy.md.
name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One publication at a time, never cancelled half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit with the history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag name
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z. Nothing was published."
            exit 1
          fi

      - name: Check the tagged commit is on main
        run: |
          set -euo pipefail
          commit=$(git rev-parse 'HEAD^{commit}')
          if ! git rev-parse --verify --quiet origin/main > /dev/null; then
            git fetch --no-tags origin main
            main_ref=FETCH_HEAD
          else
            main_ref=origin/main
          fi
          if ! git merge-base --is-ancestor "$commit" "$main_ref"; then
            echo "::error::The tagged commit $commit is not on main. Nothing was published."
            exit 1
          fi

      - name: Check CHANGELOG.md has the section of this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing at the tagged commit. Nothing was published."
            exit 1
          fi
          if ! grep -Eq "^## \[${version//./\\.}\]( - .*)?$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' heading at the tagged commit. Nothing was published."
            exit 1
          fi

  build:
    needs: check-tag
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: target/site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-live:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright_version }}-noble
      options: --ipc=host
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the browser test dependencies
        working-directory: end2end
        run: npm ci

      - name: Browser test on the published site
        working-directory: end2end
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test
