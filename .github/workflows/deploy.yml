# The site is published by this workflow (GitHub Pages source: "GitHub Actions").
# Pull requests only build and check the site; they never deploy.
# The same browser test (end2end/) runs twice: on the freshly built site served
# locally, before anything is published (job build, also on pull requests), and
# on the public address right after publishing (job verify-live).
# Documentation-only changes skip build, test and publication. The workflow is
# still always triggered (no paths filters) because the "build" check is
# required: a job skipped by a job-level "if" is reported as skipped, which
# counts as success, while a workflow skipped by paths filters never reports.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect whether anything other than documentation changed
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Documentation-only files: an ignore-list, not an allow-list. A code
          # folder forgotten in an allow-list would silently never be
          # published; a doc file missing from this list only costs one
          # unnecessary run.
          is_doc() {
            case "$1" in
              docs/* | README.md | CLAUDE.md | LICENSE) return 0 ;;
              *) return 1 ;;
            esac
          }

          # When in doubt, run everything.
          decide() {
            echo "Decision: code=$1 ($2)"
            echo "code=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            decide true "manual run"
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The checkout is the merge commit; its first parent is the base.
            changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          elif [ "$EVENT_NAME" = "push" ]; then
            # A new branch or a force push leaves no usable "before" commit.
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              decide true "no usable previous commit"
            fi
            changed=$(git diff --no-renames --name-only "$BEFORE" "$AFTER")
          else
            decide true "unexpected event"
          fi

          echo "Changed files:"
          echo "$changed"

          if [ -z "$changed" ]; then
            decide true "empty list of changed files"
          fi

          while IFS= read -r file; do
            if ! is_doc "$file"; then
              decide true "not documentation: $file"
            fi
          done <<< "$changed"

          decide false "documentation only"

  build:
    # Skipped only when detection explicitly said "documentation only". If
    # detection fails its output is empty and build runs anyway, so a broken
    # detector can never let an untested pull request pass the required check.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build the site
        run: scripts/build-site.sh

      - name: Set up Node.js for the browser test
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: end2end/package-lock.json

      - name: Install the browser test dependencies
        working-directory: end2end
        run: npm ci

      - name: Install Chromium for the browser test
        working-directory: end2end
        run: npx playwright install --with-deps chromium

      - name: Browser test on the freshly built site
        working-directory: end2end
        run: npx playwright test

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  deploy:
    # Skipped together with build on documentation-only changes.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-live:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for the browser test
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: end2end/package-lock.json

      - name: Install the browser test dependencies
        working-directory: end2end
        run: npm ci

      - name: Install Chromium for the browser test
        working-directory: end2end
        run: npx playwright install --with-deps chromium

      - name: Browser test on the published site
        working-directory: end2end
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test
